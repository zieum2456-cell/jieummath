# 학교 주간학습안내 게시판(3~6학년)을 읽어 school-weekly-data.json을 갱신한다.
# 바뀐 내용이 있을 때만 커밋한다. GitHub Actions 탭에서 "Run workflow"로 바로 실행할 수도 있다.
name: 주간학습안내 모으기

on:
  schedule:
    - cron: '23 22,1,4,7,10,13 * * *' # 한국 시각 07:23, 10:23, 13:23, 16:23, 19:23, 22:23
  workflow_dispatch:
  push:
    paths:
      - 'school-weekly.js'
      - 'scripts/school-weekly-fetch.js'
      - '.github/workflows/school-weekly.yml'

permissions:
  contents: write

concurrency:
  group: school-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 게시판 읽기
        run: node scripts/school-weekly-fetch.js
      - name: 바뀐 내용 커밋
        run: |
          git add school-weekly-data.json
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "주간학습안내 데이터 갱신"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
