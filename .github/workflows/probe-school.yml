name: probe school board (temp)
on:
  push:
    branches: [claude/lucid-feynman-5q74bj]
    paths: ['.github/workflows/probe-school.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: hotlink + page2
        run: |
          IMG=https://haedeun.icees.kr/upload/keditor/haden/306006/2026/10/20261016_091201853_86466.jpg
          for r in none https://zieum2456-cell.github.io/jieummath/school-weekly.html; do
            echo "== referer $r"
            if [ $r = none ]; then curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' -D - $IMG | grep -i -E '^HTTP|content-type|access-control|cross-origin|x-frame'
            else curl -sS -m 30 -e "$r" -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' $IMG; fi
          done
          echo "== page 2 of 306002"
          curl -sS -m 30 "https://haedeun.icees.kr/boardCnts/list.do?boardID=306002&m=020503&s=haden&page=2" | grep -o -E 'id="subject_[0-9]+"[^>]*title="[^"]*"' | head -3
          echo "== pagination html"
          curl -sS -m 30 "https://haedeun.icees.kr/boardCnts/list.do?boardID=306002&m=020503&s=haden" | sed -n '/class="pagination"/,/<\/div>/p' | head -20
          echo "== content cell context"
          curl -sS -m 30 "https://haedeun.icees.kr/boardCnts/view.do?boardID=306008&viewBoardID=306008&boardSeq=34251578&lev=0&action=view&searchType=S&statusYN=W&page=1&m=020506&s=haden" | sed -n '2875,2900p' | cut -c1-400
