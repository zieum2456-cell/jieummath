<script>
/*
 * 진도 카드 CSV 해석 · 형식 검사 · 명단 비교 (순수 로직: 화면·서버와 무관)
 * 브라우저에서는 window.Core, Node 테스트에서는 tests/load-core.js로 불러 쓴다.
 */
(function (root) {
  'use strict';

  const HEADERS = ['수업일', '학생번호', '이름', '출결', '등원', '하원', '수업시간(분)', '지난과제', '단계', '진행률', '학습주안점', '추가포인트',
    '지난과제범위', '오늘진도범위', '추가포인트범위', '오늘과제', '학습태도', '확인필요'];

  const ENUMS = {
    출결: ['정규', '결강', '보강'],
    지난과제: ['완료', '50% 이상', '50% 미만', '안 함', '두고 옴', '과제 없음'],
    단계: ['개념', '유형', '단원마무리', '교재오답', '평가', '경시'],
    진행률: ['50% 미만', '50~75%', '75~100%'],
    학습주안점: ['개념 재학습/오개념 수정', '문제 읽기(조건 찾기)', '계산 실수 교정', '풀이 과정 서술'],
    추가포인트: ['0', '3', '6', '9'],
  };
  const MULTI = ['단계', '학습주안점'];
  // 양식에서 빠졌지만 옛 카드·기록에 남아 있을 수 있는 값 (2026-10-18 지난과제 '미완' → 50% 이상 / 50% 미만)
  const LEGACY = { 지난과제: ['미완'] };
  // 과제 완료율 계산에서 지난과제 값별 점수 (두고 옴은 설정대로, 과제 없음은 세지 않음)
  const HOMEWORK_SCORE = { 완료: 1, '50% 이상': 0.7, '50% 미만': 0.3, 미완: 0.5, '안 함': 0 };
  // 2026-10-18 카드 양식 변경 전 이름: 열 '오답원인' → '학습주안점', 보기는 뜻이 같은 것끼리 바꾼다
  const OLD_FOCUS_COL = '오답원인';
  const OLD_FOCUS = { '개념 이해 부족': '개념 재학습/오개념 수정', '조건 놓침': '문제 읽기(조건 찾기)', '계산 실수': '계산 실수 교정', '풀이 과정 생략': '풀이 과정 서술' };
  const focusList = (s) => splitList(s).map((t) => OLD_FOCUS[t] || t).join('; ');
  // 2026-10-18 학습 단계 보기 'Test' → '평가'
  const OLD_STAGE = { Test: '평가' };
  const stageList = (s) => splitList(s).map((t) => OLD_STAGE[t] || t).join('; ');
  const RANGE_COLS = ['지난과제범위', '오늘진도범위', '추가포인트범위', '오늘과제'];
  const BOOKS = ['디딤돌', '자료집', '문장제', '교재오답', '교재오답-자료집', '단원Test', '주간Test', '경시'];
  const MARKS = { '○': '끝냄', '△': '하다 멈춤', '': '아직 안 함' };
  // 결강 카드는 비어 있어도 되는 칸
  const ABSENT_OPTIONAL = ['등원', '하원', '수업시간(분)', '지난과제', '단계', '진행률', '추가포인트'];

  const nfc = (s) => String(s == null ? '' : s).normalize('NFC');
  const splitList = (s) => String(s || '').split(';').map((x) => x.trim()).filter(Boolean);

  // 긴 교재명부터 맞춰 본다 (교재오답-자료집이 교재오답으로 잘리지 않게)
  const RANGE_RE = new RegExp('^(' + [...BOOKS].sort((a, b) => b.length - a.length).map((b) => b.replace(/[-]/g, '\\-')).join('|')
    + ')(?:\\(([^()]*)\\))?\\[([^\\[\\]]*)\\]([○△])?$');

  /** 범위 항목 하나: 교재명(단원)[범위]표시 → { raw, ok, book, unit, range, mark } */
  function parseRangeItem(raw) {
    const text = String(raw).trim();
    const m = text.match(RANGE_RE);
    if (!m) return { raw: text, ok: false };
    return { raw: text, ok: true, book: m[1], unit: m[2] || '', range: m[3], mark: m[4] || '' };
  }

  const parseRangeList = (s) => splitList(s).map(parseRangeItem);

  /** CSV 텍스트 → [{ rowNo, cells }] (rowNo: 표로 열었을 때 몇 번째 행인지, 제목 줄이 1. 빈 줄도 센다) */
  function parseCsv(text) {
    const src = String(text).replace(/^﻿/, '');
    const recs = [];
    let row = [];
    let field = '';
    let quoted = false;
    let rowNo = 1;
    const end = () => {
      row.push(field);
      recs.push({ rowNo: rowNo++, cells: row });
      row = [];
      field = '';
    };
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (quoted) {
        if (c === '"') {
          if (src[i + 1] === '"') {
            field += '"';
            i++;
          } else quoted = false;
        } else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') {
        row.push(field);
        field = '';
      } else if (c === '\r' || c === '\n') {
        if (c === '\r' && src[i + 1] === '\n') i++;
        end();
      } else field += c;
    }
    if (field !== '' || row.length) end();
    return recs.filter((r) => r.cells.some((v) => v.trim() !== ''));
  }

  /** 파일 하나 읽기 → { fileName, fileDate, headerErrors, cards: [{ rowNo, cellCount, values }] } */
  function readCsv(fileName, text) {
    const name = nfc(fileName);
    const m = name.match(/(\d{4})(\d{2})(\d{2})/);
    const res = { fileName: name, fileDate: m ? `${m[1]}-${m[2]}-${m[3]}` : '', headerErrors: [], cards: [] };
    const recs = parseCsv(nfc(text));
    if (!recs.length) {
      res.headerErrors.push('파일이 비어 있습니다.');
      return res;
    }
    // 옛 양식 CSV(오답원인 열)도 받는다
    const oldFocus = recs[0].cells.some((s) => s.trim() === OLD_FOCUS_COL);
    const head = recs[0].cells.map((s) => s.trim()).map((h) => (h === OLD_FOCUS_COL ? '학습주안점' : h));
    for (let i = 0; i < Math.max(head.length, HEADERS.length); i++) {
      if (head[i] === HEADERS[i]) continue;
      const got = head[i] == null ? '(없음)' : `"${head[i]}"`;
      const want = HEADERS[i] == null ? '(이 열은 없어야 함)' : `"${HEADERS[i]}"`;
      res.headerErrors.push(`${i + 1}번째 열 이름이 ${got}입니다. 올바른 이름: ${want}`);
    }
    if (res.headerErrors.length && head.length === HEADERS.length && [...head].sort().join() === [...HEADERS].sort().join()) {
      res.headerErrors.unshift('열 이름은 모두 있지만 순서가 다릅니다.');
    }
    if (res.headerErrors.length) return res;
    res.cards = recs.slice(1).map((r) => {
      const values = {};
      HEADERS.forEach((h, i) => (values[h] = (r.cells[i] == null ? '' : r.cells[i]).trim()));
      if (oldFocus) values.학습주안점 = focusList(values.학습주안점);
      values.단계 = stageList(values.단계);
      return { rowNo: r.rowNo, cellCount: r.cells.length, values };
    });
    if (!res.cards.length) res.headerErrors.push('카드(제목 줄 아래 행)가 없습니다.');
    return res;
  }

  function validDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return false;
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
  }

  function timeToMin(s) {
    const m = /^(\d{2}):(\d{2})$/.exec(s);
    if (!m || +m[1] > 23 || +m[2] > 59) return null;
    return +m[1] * 60 + +m[2];
  }

  /** 카드 손글씨 이름(성 없이 쓰기도 함)과 명단 이름(성 포함)이 같은 사람인지 */
  function nameMatches(a, b) {
    const x = nfc(a).replace(/\s/g, '');
    const y = nfc(b).replace(/\s/g, '');
    if (!x || !y) return false;
    const strip = (s, t) => s.slice(1) === t || (s.length >= 4 && s.slice(2) === t); // 성 1자 / 2자(남궁 등)
    return x === y || strip(y, x) || strip(x, y);
  }

  const cardKey = (v) => `${v.수업일}_${v.학생번호}`;

  /**
   * 카드 한 장 검사 → [{ field, level: 'error'|'warn', msg }]
   * field가 '_'로 시작하면 특정 칸이 아닌 카드 전체 문제.
   * ctx: { roster: [{no,name,status}], existing: 같은 학생·날짜의 저장된 기록(있으면), batchCount: 같은 업로드 안 같은 키 개수, fileDate, cellsOk }
   */
  function validateCard(values, ctx) {
    ctx = ctx || {};
    const v = values;
    const out = [];
    const err = (field, msg) => out.push({ field, level: 'error', msg });
    const warn = (field, msg) => out.push({ field, level: 'warn', msg });
    const absent = v.출결 === '결강';
    const empty = (f) => !String(v[f] || '').trim();

    if (ctx.cellCount != null && ctx.cellCount !== HEADERS.length && !ctx.cellsOk) {
      err('_cells', `이 행은 칸이 ${ctx.cellCount}개입니다(18개여야 함). 쉼표가 빠지거나 더 들어가 값이 밀렸을 수 있습니다. 각 칸 값을 확인한 뒤 [칸 위치 확인함]을 누르세요.`);
    }

    if (empty('수업일')) err('수업일', '비어 있습니다.');
    else if (!validDate(v.수업일)) err('수업일', 'YYYY-MM-DD 형식의 날짜여야 합니다. (예: 2026-10-09)');
    else if (ctx.fileDate && ctx.fileDate !== v.수업일) warn('수업일', `파일 이름의 날짜(${ctx.fileDate})와 다릅니다.`);

    if (empty('학생번호')) err('학생번호', '비어 있습니다.');
    else if (/^\d$/.test(v.학생번호)) err('학생번호', `두 자리여야 합니다. 0${v.학생번호}번이 맞으면 "0${v.학생번호}"로 고쳐 주세요.`);
    else if (!/^\d{2}$/.test(v.학생번호)) err('학생번호', '숫자 두 자리여야 합니다.');

    if (empty('이름')) err('이름', '비어 있습니다.');

    if (empty('출결')) err('출결', '비어 있습니다.');
    else if (!ENUMS.출결.includes(v.출결)) err('출결', `"${v.출결}"은(는) 목록에 없는 값입니다. (${ENUMS.출결.join(' / ')})`);

    const need = (f) => {
      if (!empty(f)) return true;
      if (!(absent && ABSENT_OPTIONAL.includes(f))) err(f, '비어 있습니다.');
      return false;
    };

    ['지난과제', '진행률', '추가포인트'].forEach((f) => {
      if (need(f) && !ENUMS[f].includes(v[f]) && !(LEGACY[f] || []).includes(v[f])) err(f, `"${v[f]}"은(는) 목록에 없는 값입니다. (${ENUMS[f].join(' / ')})`);
    });

    MULTI.forEach((f) => {
      const tokens = splitList(v[f]);
      if (!tokens.length) {
        if (f === '단계') need(f);
        return;
      }
      const bad = tokens.filter((t) => !ENUMS[f].includes(t));
      if (bad.length) err(f, `목록에 없는 값: ${bad.map((b) => `"${b}"`).join(', ')} (${ENUMS[f].join(' / ')} 중에서 "; "로 구분)`);
      if (new Set(tokens).size !== tokens.length) warn(f, '같은 값이 두 번 들어 있습니다.');
    });

    const times = {};
    ['등원', '하원'].forEach((f) => {
      if (!need(f)) return;
      times[f] = timeToMin(v[f]);
      if (times[f] == null) err(f, 'HH:MM 형식(24시간제)이어야 합니다. (예: 16:55)');
    });
    let minutes = null;
    if (need('수업시간(분)')) {
      if (/^\d+$/.test(v['수업시간(분)'])) minutes = Number(v['수업시간(분)']);
      else err('수업시간(분)', '정수(분)여야 합니다.');
    }
    if (times.등원 != null && times.하원 != null) {
      const diff = times.하원 - times.등원;
      if (diff <= 0) err('하원', '하원 시각이 등원 시각보다 빠르거나 같습니다.');
      else if (minutes != null && diff !== minutes) {
        warn('수업시간(분)', `등원·하원 차이는 ${diff}분인데 수업시간은 ${minutes}분입니다.`);
      }
    }

    if (v.지난과제 === '과제 없음' && !empty('지난과제범위')) warn('지난과제범위', '지난과제가 "과제 없음"인데 지난과제범위가 있습니다.');

    RANGE_COLS.forEach((f) => {
      const bad = parseRangeList(v[f]).filter((x) => !x.ok);
      if (bad.length) {
        warn(f, `형식이 맞지 않는 항목: ${bad.map((b) => `"${b.raw}"`).join(', ')} — 교재명(단원)[범위]표시 형식이 아니라 원문 그대로 보존합니다.`);
      }
    });

    if (ctx.roster && /^\d{2}$/.test(v.학생번호)) {
      const r = ctx.roster.find((s) => s.no === v.학생번호);
      if (!r) {
        const same = ctx.roster.filter((s) => nameMatches(v.이름, s.name));
        warn('학생번호', `명단에 ${v.학생번호}번 학생이 없습니다.`
          + (same.length ? ` 이름이 같은 학생: ${same.map((s) => `${s.no}번 ${s.name}`).join(', ')}` : ''));
      } else if (!nameMatches(v.이름, r.name)) {
        warn('이름', `명단의 ${r.no}번은 "${r.name}"입니다.`);
      } else if (r.status === '퇴원') {
        warn('학생번호', `명단에 퇴원으로 표시된 학생입니다(${r.no}번 ${r.name}).`);
      }
    }

    if (ctx.batchCount > 1) err('_batch', `이번 업로드에 같은 학생·같은 날짜 카드가 ${ctx.batchCount}장 있습니다. 한 장만 남기고 나머지는 [저장 안 함]으로 바꾸세요.`);
    if (ctx.existing) warn('_dup', '같은 학생·같은 날짜 기록이 이미 저장돼 있습니다. 덮어쓸지 건너뛸지 고르세요.');

    return out;
  }

  /** 저장할 값으로 정리: 여러 개 고르는 칸은 "; "로 다시 이어 붙인다 */
  function canonical(values) {
    const out = {};
    HEADERS.forEach((h) => {
      const s = String(values[h] == null ? '' : values[h]).trim();
      out[h] = h === '학습주안점' ? focusList(s) : h === '단계' ? stageList(s) : MULTI.includes(h) ? splitList(s).join('; ') : s;
    });
    return out;
  }

  /** 확인 화면 정렬 순위: 확인필요 → 오류 → 경고 → 문제없음 */
  function rankOf(values, issues) {
    if (String(values.확인필요 || '').trim()) return 0;
    if (issues.some((x) => x.level === 'error')) return 1;
    if (issues.length) return 2;
    return 3;
  }

  /* ---------- 명단 ---------- */

  /** 학생번호 입력값 정리: '5' → '05', 형식이 틀리면 null */
  function normalizeNo(input) {
    const s = String(input == null ? '' : input).trim();
    return /^\d{1,2}$/.test(s) ? s.padStart(2, '0') : null;
  }

  /** 등원 요일 글자 정리: '수, 월 금' → '월수금' (월요일부터, 요일 글자만) */
  function normalizeDays(input) {
    const s = nfc(input);
    return '월화수목금토일'.split('').filter((d) => s.indexOf(d) >= 0).join('');
  }
  const isDays = (t) => /^[월화수목금토일]+$/.test(t);

  /**
   * 붙여넣은 명단 텍스트(번호 이름 [학년] [등원 요일], 탭·쉼표·공백 구분) → { list, invalid }
   * 등원 요일('월수금')이 있는 줄만 days 를 넣는다 (없으면 지금 명단의 요일을 그대로 둔다)
   */
  function parseRosterText(text) {
    const list = [];
    const invalid = [];
    String(text || '').split(/\r?\n/).forEach((line, i) => {
      const t = nfc(line).trim();
      if (!t) return;
      const parts = t.split(/\t|,|\s{1,}/).map((s) => s.trim()).filter(Boolean);
      const no = normalizeNo(parts[0]);
      if (no == null || !parts[1]) return invalid.push({ line: i + 1, text: t, reason: '번호(숫자 두 자리)와 이름이 필요합니다.' });
      if (list.some((s) => s.no === no)) return invalid.push({ line: i + 1, text: t, reason: `${no}번이 두 번 들어 있습니다.` });
      const rest = parts.slice(2);
      const days = rest.find(isDays);
      const item = { no, name: parts[1], grade: rest.find((t) => !isDays(t)) || '' };
      if (days) item.days = normalizeDays(days);
      list.push(item);
    });
    return { list, invalid };
  }

  /**
   * 지금 명단(current)과 불러온 명단(incoming) 비교
   * → { add, update: [{ no, from, to }], missing, same }
   *  - 학년은 불러온 쪽에 값이 있을 때만 바꾼다
   *  - 퇴원으로 표시된 학생이 다시 나오면 재원으로 되돌린다(update)
   *  - 등원 요일은 불러온 쪽에 days 가 있을 때만 비교한다
   */
  function diffRoster(current, incoming) {
    const add = [];
    const update = [];
    let same = 0;
    incoming.forEach((s) => {
      const c = current.find((x) => x.no === s.no);
      if (!c) return add.push({ no: s.no, name: s.name, grade: s.grade || '', days: s.days || '' });
      const to = { name: s.name, grade: s.grade || c.grade || '', days: s.days != null ? s.days : c.days || '', status: '재원' };
      const from = { name: c.name, grade: c.grade || '', days: c.days || '', status: c.status || '재원' };
      if (['name', 'grade', 'days', 'status'].some((k) => to[k] !== from[k])) update.push({ no: s.no, from, to });
      else same++;
    });
    const missing = current.filter((c) => c.status !== '퇴원' && !incoming.some((s) => s.no === c.no)).map((c) => ({ no: c.no, name: c.name }));
    return { add, update, missing, same };
  }

  /* ---------- 카드 인쇄 ---------- */

  /**
   * 그 날짜 요일에 등원하는 재원생 (번호 순)
   * roster: [{ no, name, days: '월수금', status }], date: 'YYYY-MM-DD'
   */
  function studentsOn(roster, date) {
    const wd = weekday(date);
    if (!wd) return [];
    return roster
      .filter((s) => s.status !== '퇴원' && String(s.days || '').indexOf(wd) >= 0)
      .sort((a, b) => a.no.localeCompare(b.no));
  }

  /** 그 날짜 다음 등원일 (등원 요일 '월수금' 기준, 휴강·보강은 모름). 요일이 없으면 '' */
  function nextClassDate(days, date) {
    if (!validDate(date)) return '';
    for (let i = 1; i <= 7; i++) {
      const d = addDays(date, i);
      if (String(days || '').indexOf(weekday(d)) >= 0) return d;
    }
    return '';
  }

  /** 카드 목록을 A4 한 장에 n장씩 나눈다 (마지막 장의 빈 자리는 null) */
  function toSheets(cards, n) {
    const out = [];
    for (let i = 0; i < cards.length; i += n) {
      const page = cards.slice(i, i + n);
      while (page.length < n) page.push(null);
      out.push(page);
    }
    return out;
  }

  /* ---------- 기간 · 집계 (2단계) ---------- */

  const LEVELS = ['기본', '기본+유형', '기본+응용'];
  const GROUPS = ['A', 'B'];
  const GRADES = ['초1', '초2', '초3', '초4', '초5', '초6', '중1', '중2', '중3', '고1', '고2', '고3'];
  // 설정 "두고옴처리" 값 → 완료율 계산에서의 가중치 (null = 계산에서 제외)
  const LEFT_WEIGHT = { '안 함과 같이(×0)': 0, '절반만 인정(×0.5)': 0.5, '미완과 같이(×0.5)': 0.5, '계산에서 제외': null };
  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

  const toUTC = (d) => new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)));
  const fromUTC = (t) => t.toISOString().slice(0, 10);
  const addDays = (d, n) => fromUTC(new Date(toUTC(d).getTime() + n * 86400000));
  const weekday = (d) => (validDate(d) ? WEEKDAYS[toUTC(d).getUTCDay()] : '');

  /** 기간 단추 → { from, to } ('' = 제한 없음). today: 'YYYY-MM-DD' */
  function periodRange(preset, today) {
    if (preset === '2w') return { from: addDays(today, -13), to: today };
    if (preset === '4w') return { from: addDays(today, -27), to: today };
    if (preset === 'month') return { from: today.slice(0, 8) + '01', to: today };
    if (preset === 'lastMonth') {
      const end = addDays(today.slice(0, 8) + '01', -1);
      return { from: end.slice(0, 8) + '01', to: end };
    }
    return { from: '', to: '' };
  }
  const inPeriod = (date, p) => (!p.from || date >= p.from) && (!p.to || date <= p.to);

  /**
   * 과제 완료율 = (완료 + 50% 이상×0.7 + 50% 미만×0.3 + 두고 옴×가중치) ÷ (과제 없음을 뺀 횟수)
   * 옛 기록의 '미완'은 ×0.5로 센다.
   * "두고 옴"을 계산에서 제외하면 분모에서도 뺀다. 지난과제가 비어 있는 기록(결강 등)은 세지 않는다.
   */
  function homework(records, leftMode) {
    const counts = { 완료: 0, '50% 이상': 0, '50% 미만': 0, 미완: 0, '안 함': 0, '두고 옴': 0, '과제 없음': 0 };
    records.forEach((r) => {
      if (r.지난과제 in counts) counts[r.지난과제]++;
    });
    const w = leftMode in LEFT_WEIGHT ? LEFT_WEIGHT[leftMode] : 0;
    const scored = Object.keys(HOMEWORK_SCORE);
    const denom = scored.reduce((n, k) => n + counts[k], 0) + (w === null ? 0 : counts['두고 옴']);
    const num = scored.reduce((n, k) => n + counts[k] * HOMEWORK_SCORE[k], 0) + (w ? counts['두고 옴'] * w : 0);
    return { counts, denom, rate: denom ? num / denom : null };
  }

  /** 단계 변화: 날짜순으로 단계 조합이 바뀐 지점만 → [{ date, stage, count }] */
  function stageChanges(records) {
    const out = [];
    [...records].sort((a, b) => a.수업일.localeCompare(b.수업일)).forEach((r) => {
      const order = (t) => (ENUMS.단계.indexOf(t) < 0 ? 99 : ENUMS.단계.indexOf(t));
      const stage = splitList(r.단계).sort((a, b) => order(a) - order(b)).join('·');
      if (!stage) return;
      const last = out[out.length - 1];
      if (last && last.stage === stage) last.count++;
      else out.push({ date: r.수업일, stage, count: 1 });
    });
    return out;
  }

  /** 학생 한 명의 기간 집계 */
  function summarize(records, opts) {
    opts = opts || {};
    const rs = [...records].sort((a, b) => a.수업일.localeCompare(b.수업일));
    const attendance = { 정규: 0, 보강: 0, 결강: 0 };
    rs.forEach((r) => {
      if (r.출결 in attendance) attendance[r.출결]++;
    });
    const mins = rs.filter((r) => r.출결 !== '결강').map((r) => Number(r['수업시간(분)'])).filter((n) => n > 0);
    const errorMap = {};
    rs.forEach((r) => splitList(focusList(r.학습주안점)).forEach((t) => (errorMap[t] = (errorMap[t] || 0) + 1)));
    const errors = Object.keys(errorMap).map((k) => [k, errorMap[k]])
      .sort((a, b) => b[1] - a[1] || ENUMS.학습주안점.indexOf(a[0]) - ENUMS.학습주안점.indexOf(b[0]));
    return {
      count: rs.length,
      from: rs.length ? rs[0].수업일 : '',
      to: rs.length ? rs[rs.length - 1].수업일 : '',
      attendance,
      homework: homework(rs, opts.leftMode),
      errors,
      points: rs.reduce((sum, r) => sum + (Number(r.추가포인트) || 0), 0),
      avgMinutes: mins.length ? Math.round(mins.reduce((a, b) => a + b, 0) / mins.length) : null,
      stages: stageChanges(rs),
    };
  }

  /** CSV 한 칸 (쉼표·따옴표·줄바꿈이 있으면 따옴표로 감싼다) */
  const csvCell = (v) => {
    const s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const toCsv = (rows) => '\uFEFF' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';

  const api = {
    HEADERS, ENUMS, MULTI, RANGE_COLS, BOOKS, MARKS,
    nfc, splitList, parseRangeItem, parseRangeList, parseCsv, readCsv, validDate, timeToMin, nameMatches, cardKey,
    validateCard, canonical, rankOf, normalizeNo, normalizeDays, parseRosterText, diffRoster, studentsOn, nextClassDate, toSheets,
    LEVELS, GROUPS, GRADES, LEFT_WEIGHT, addDays, weekday, periodRange, inPeriod, homework, stageChanges, summarize, csvCell, toCsv,
  };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Core = api;
})(typeof self !== 'undefined' ? self : this);
</script>
