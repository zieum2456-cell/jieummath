<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #e8efff;
    --danger: #dc2626; --danger-soft: #fde8e8;
    --warn: #b45309; --warn-soft: #fef3c7;
    --review: #c2410c; --review-soft: #ffedd5;
    --ok: #047857; --ok-soft: #d1fae5;
    --top-h: 96px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1e24; --text: #e6e8eb; --muted: #9aa3ad; --line: #2c323a;
      --accent: #6b9bff; --accent-soft: #1f2a44; --danger: #f87171; --danger-soft: #3b1b1b;
      --warn: #fbbf24; --warn-soft: #3a2f10; --review: #fb923c; --review-soft: #3d2312; --ok: #34d399; --ok-soft: #12352a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 14px; }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line);
    padding: 10px 16px 6px; padding-top: max(10px, env(safe-area-inset-top)); }
  .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { margin: 0 0 6px; font-size: 19px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { border: 0; background: none; padding: 8px 14px; border-radius: 10px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--review); color: #fff; font-size: 12px; font-weight: 700; }

  main { max-width: 1180px; margin: 0 auto; padding: 16px; padding-bottom: 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 17px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label.stack { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); margin-bottom: 8px; max-width: 320px; }

  input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 16px; cursor: pointer; min-height: 42px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.small { min-height: 34px; padding: 4px 12px; font-size: 14px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.danger { color: var(--danger); }

  .upload-btn { display: flex; align-items: center; gap: 16px; padding: 22px; border: 2px dashed var(--accent); border-radius: 14px; background: var(--accent-soft); cursor: pointer; }
  .upload-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .upload-icon { font-size: 34px; line-height: 1; color: var(--accent); }

  .notice { border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--line); background: var(--card); }
  .notice.err { border-color: var(--danger); background: var(--danger-soft); }
  .notice.ok { border-color: var(--ok); background: var(--ok-soft); }
  .notice.warn { border-color: var(--warn); background: var(--warn-soft); }
  .notice ul { margin: 6px 0 0; padding-left: 20px; }
  .notice a { color: var(--accent); }

  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--line); color: var(--text); white-space: nowrap; }
  .badge.rv { background: var(--review-soft); color: var(--review); }
  .badge.err { background: var(--danger-soft); color: var(--danger); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.off { background: var(--line); color: var(--muted); }

  /* 확인 화면 */
  .review { display: block; }
  .list .group { margin: 14px 4px 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .item { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .item.r0 { border-left-color: var(--review); background: var(--review-soft); }
  .item.r1 { border-left-color: var(--danger); }
  .item.r2 { border-left-color: var(--warn); }
  .item.r3 { border-left-color: var(--ok); }
  .item.sel { outline: 3px solid var(--accent); outline-offset: -1px; }
  .item.off { opacity: .55; }
  .item-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .item-sub { font-size: 13px; color: var(--muted); margin: 2px 0 4px; }
  .item .badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .file-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .file-row:last-child { border-bottom: 0; }

  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .detail-head h2 { margin: 0; font-size: 20px; }
  .detail-head small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; }
  .switch input { width: 22px; height: 22px; }

  .review-box { border: 2px solid var(--review); background: var(--review-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .review-box b { color: var(--review); }
  .review-box ul { margin: 6px 0 0; padding-left: 20px; }
  .issue-box { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .issue-box.err { background: var(--danger-soft); border: 1px solid var(--danger); }
  .issue-box.warn { background: var(--warn-soft); border: 1px solid var(--warn); }
  .issue-box ul { margin: 4px 0 0; padding-left: 20px; }

  .fields { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .fld { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .fld.wide { grid-column: 1 / -1; }
  .fld.err { border-color: var(--danger); box-shadow: inset 4px 0 0 var(--danger); }
  .fld.warn { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
  .flabel { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
  .flabel .edited { display: none; color: var(--accent); font-weight: 600; }
  .fld.changed .flabel .edited { display: inline; }
  .flabel .revert { display: none; margin-left: auto; border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
  .fld.changed .flabel .revert { display: inline; }
  .fmsg { font-size: 13px; margin-top: 6px; }
  .fld.err .fmsg { color: var(--danger); }
  .fld.warn .fmsg { color: var(--warn); }
  .fmsg:empty { display: none; }
  .fhint { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { font: inherit; font-size: 15px; min-height: 40px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .seg button.bad { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); text-decoration: line-through; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .chip .m { font-weight: 700; margin-left: 4px; }
  .chip.done { border-color: var(--ok); }
  .chip.done .m { color: var(--ok); }
  .chip.partial { border-color: var(--warn); }
  .chip.partial .m { color: var(--warn); }
  .chip.raw { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
  .time3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .time3 label { font-size: 12px; color: var(--muted); }

  .dup-box { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .dup-box dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; font-size: 14px; }
  .dup-box dt { color: var(--muted); }
  .dup-box dd { margin: 0; }
  .card-nav { display: flex; justify-content: space-between; margin-top: 14px; gap: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .only-narrow { display: inline-flex; }

  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .savebar .sum { font-size: 14px; }
  .savebar .btn { min-width: 120px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 15px; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .table-wrap td, .table-wrap th { white-space: nowrap; }
  .diff-list { list-style: none; padding: 0; margin: 8px 0; }
  .diff-list li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .diff-list label { display: flex; gap: 10px; align-items: center; }
  .diff-list input { width: 20px; height: 20px; flex: none; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 40; background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; }
  .loading { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; font-weight: 600; }
  .spinner { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 트래킹 */
  .row.nowrap { flex-wrap: nowrap; }
  .row.nowrap select { flex: 1; min-width: 0; }
  .date-input { max-width: 190px; }
  [data-period] .seg { margin-top: 10px; }
  .period-dates { margin-top: 8px; flex-wrap: nowrap; }
  .period-dates input { max-width: 170px; min-width: 0; flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: 13px; color: var(--muted); font-weight: 600; }
  .stat .v { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .stat .s { font-size: 12px; color: var(--muted); }
  .card h3 { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
  .stages { margin: 0; padding-left: 20px; }
  .stages li { margin: 2px 0; }
  .entry { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .entry.absent { border-left-color: var(--line); opacity: .75; }
  .entry-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 8px; }
  .entry-head .who { font-size: 17px; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
  .entry-grid { display: grid; grid-template-columns: 82px 1fr; gap: 6px 10px; font-size: 15px; }
  .entry-grid .k { color: var(--muted); font-size: 13px; font-weight: 600; padding-top: 2px; }
  .entry-grid .chips { margin-top: 0; }
  .day-grid { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  .sum-table tbody tr { cursor: pointer; }
  .sum-table tbody tr:hover { background: var(--accent-soft); }
  .sum-table td { vertical-align: top; }
  .sum-table .rate-low { color: var(--danger); font-weight: 700; }
  .edit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; margin-bottom: 10px; }
  .edit-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
  .edit-grid .wide { grid-column: 1 / -1; }
  tr.editing > td { background: var(--accent-soft); white-space: normal; }

  /* 좁은 화면(아이폰): 목록과 카드 편집을 번갈아 보여 준다 */
  @media (max-width: 767px) {
    nav button { padding: 8px 10px; font-size: 15px; }
    .period-dates input { font-size: 15px; padding: 8px 6px; }
    .review.show-detail .list { display: none; }
    .review:not(.show-detail) .detail { display: none; }
  }
  /* 넓은 화면(아이패드): 왼쪽 목록 + 오른쪽 편집 */
  @media (min-width: 768px) {
    .review { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
    .list { position: sticky; top: calc(var(--top-h) + 8px); max-height: calc(100vh - var(--top-h) - 90px); overflow-y: auto; padding-right: 4px; -webkit-overflow-scrolling: touch; }
    .fields { grid-template-columns: 1fr 1fr; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .day-grid { grid-template-columns: 1fr 1fr; }
    .edit-grid { grid-template-columns: repeat(4, 1fr); }
    .only-narrow { display: none; }
  }
  @media (min-width: 1100px) {
    .review { grid-template-columns: 340px 1fr; }
  }
</style>
