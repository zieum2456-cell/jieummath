# 진도 카드 프로그램 설정
# 이 파일을 복사해 config.toml로 저장한 뒤 값을 넣으세요. (config.toml은 GitHub에 올라가지 않습니다)

[api]
# Claude API 키 (https://console.anthropic.com 에서 발급, sk-ant- 로 시작)
anthropic_api_key = ""
# 손글씨 판독에 쓸 모델
model = "claude-opus-5-5"
# 판독에 들이는 노력: low / medium / high  (높을수록 정확할 수 있지만 느리고 비쌈)
effort = "medium"
# Claude가 판독을 거절하면 서버에서 다른 모델로 자동 재시도
use_fallbacks = true

[server]
port = 8000
# 접속을 허용할 주소 범위. "auto"는 이 컴퓨터가 연결된 와이파이(예: 192.168.0.x)만 허용합니다.
# 공유기 주소 체계가 특이하면 직접 적으세요. 예: ["192.168.0.0/24"]
allowed_networks = ["auto"]

[omr]
# 칸 안이 이 비율 이상 검으면 '칠함', 이하이면 '빈 칸', 그 사이는 '확인 필요'
filled = 0.38
empty = 0.18

[storage]
data_dir = "data"
# 원본 사진과 카드 이미지를 보관하는 기간 (일). 수업 기록은 지워지지 않습니다.
photo_retention_days = 90
